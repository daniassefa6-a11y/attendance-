<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sundros2019 - የተማሪዎች አቴንዳንስ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .school-header { text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .school-name { color: #007bff; margin: 0; font-size: 30px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        .nav-btn.active { background: #007bff; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"], select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-delete { background-color: #dc3545; padding: 6px 12px; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background-color: #bd2130; }
        .btn-excel { background-color: #17a2b8; padding: 5px 10px; border: none; color: white; border-radius: 3px; cursor: pointer; margin-right: 5px; }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .timer-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; border: 1px solid #ffeeba; margin-bottom: 15px; font-weight: bold; text-align: center; }
        .locked-badge { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .history-card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 15px; margin-bottom: 15px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .date-picker-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .date-select-group { display: flex; gap: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="school-header">
        <h1 class="school-name">Sundros2019</h1>
        <p style="color:#555; margin:5px 0 0 0;">የተማሪዎች አቴንዳንስ መያዣ</p>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn active" id="btnToday" onclick="switchPage('today')">የዕለቱ መዝገብ</button>
        <button class="nav-btn" id="btnHistory" onclick="switchPage('history')">የቀደሙ ታሪኮች</button>
    </div>

    <!-- 1. የዕለቱ ገጽ -->
    <div id="todayPage" class="page-view active">
        <div class="date-picker-box">
            <label style="font-weight: bold; color: #333;">ቀን ይምረጡ (በኢትዮጵያ ዘመን አቆጣጠር)፡</label>
            <div class="date-select-group">
                <select id="ethDay" onchange="onCustomDateChange()"></select>
                <select id="ethMonth" onchange="onCustomDateChange()"></select>
                <select id="ethYear" onchange="onCustomDateChange()"></select>
            </div>
            <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-excel" onclick="exportTodayToExcel()">የዛሬውን Excel አውርድ</button>
                <button style="padding: 5px 10px; font-size: 13px; background: #007bff;" onclick="resetToToday()">ወደ ዛሬ ቀን ተመለስ</button>
            </div>
        </div>

        <div id="timerContainer" class="timer-box">
            ቀሪ ሰዓት (24 ሰዓት ከመዘጋቱ በፊት)፡ <span id="countdownTimer">--:--:--</span>
        </div>

        <div class="form-group" id="addStudentSection">
            <input type="text" id="studentName" placeholder="አዲስ ተማሪ ጨምር...">
            <button onclick="addStudent()">ተማሪ ጨምር</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ተ.ቁ</th>
                    <th>የተማሪ ስም</th>
                    <th>ሁኔታ</th>
                    <th>ድርጊት</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>

    <!-- 2. የታሪክ ገጽ -->
    <div id="historyPage" class="page-view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin:0;">የተመዘገቡ የቀደሙ ታሪኮች</h3>
            <button class="btn-excel" onclick="exportAllHistoryToExcel()">ሁሉንም ታሪክ Excel አውርድ</button>
        </div>
        <div id="historyContainer"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBngn2BpKdrFSeXq5lqMJT3PsyuFW0qiTA",
        authDomain: "project-7b8c40b5-a416-4965-98b.firebaseapp.com",
        databaseURL: "https://project-7b8c40b5-a416-4965-98b-default-rtdb.firebaseio.com",
        projectId: "project-7b8c40b5-a416-4965-98b",
        storageBucket: "project-7b8c40b5-a416-4965-98b.firebasestorage.app",
        messagingSenderId: "861183020980",
        appId: "1:861183020980:web:d2e9308421779611c96ce1",
        measurementId: "G-EPZCFKVZ27"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

    const monthsEth = ["መስከረም", "ጥቅምት", "ኅዳር", "ታኅሣሥ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];

    function getEthiopicDate(date = new Date()) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();

        let ethYear = year - 8;
        if (month < 9 || (month === 9 && day < 11)) {
            ethYear -= 1;
        }

        const isLeap = (ethYear + 1) % 4 === 0;
        const newYearDay = isLeap ? 12 : 11;

        let startOfEthYear = new Date(year, 8, newYearDay);
        if (date < startOfEthYear) {
            startOfEthYear = new Date(year - 1, 8, isLeap ? 12 : 11);
        }

        const diffDays = Math.floor((date - startOfEthYear) / (1000 * 60 * 60 * 24));
        let ethMonthIndex = Math.floor(diffDays / 30);
        let ethDay = (diffDays % 30) + 1;

        if (ethMonthIndex >= 12) {
            ethMonthIndex = 12;
            ethDay = diffDays - 360 + 1;
        }

        return {
            year: ethYear,
            monthIndex: ethMonthIndex,
            day: ethDay,
            formatted: `${monthsEth[ethMonthIndex]} ${ethDay} ቀን ${ethYear} ዓ.ም`,
            key: `${ethYear}-${ethMonthIndex + 1}-${ethDay}`
        };
    }

    let selectedEthDate = getEthiopicDate();

    function populateDatePickers() {
        const daySelect = document.getElementById('ethDay');
        const monthSelect = document.getElementById('ethMonth');
        const yearSelect = document.getElementById('ethYear');

        daySelect.innerHTML = "";
        for (let i = 1; i <= 30; i++) {
            daySelect.innerHTML += `<option value="${i}">${i}</option>`;
        }

        monthSelect.innerHTML = "";
        monthsEth.forEach((m, idx) => {
            monthSelect.innerHTML += `<option value="${idx}">${m}</option>`;
        });

        yearSelect.innerHTML = "";
        let currentYear = selectedEthDate.year;
        for (let y = currentYear - 2; y <= currentYear + 2; y++) {
            yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        }

        setPickerValues(selectedEthDate);
    }

    function setPickerValues(ethObj) {
        document.getElementById('ethDay').value = ethObj.day;
        document.getElementById('ethMonth').value = ethObj.monthIndex;
        document.getElementById('ethYear').value = ethObj.year;
    }

    function onCustomDateChange() {
        let d = parseInt(document.getElementById('ethDay').value);
        let mIdx = parseInt(document.getElementById('ethMonth').value);
        let y = parseInt(document.getElementById('ethYear').value);

        selectedEthDate = {
            year: y,
            monthIndex: mIdx,
            day: d,
            formatted: `${monthsEth[mIdx]} ${d} ቀን ${y} ዓ.ም`,
            key: `${y}-${mIdx + 1}-${d}`
        };

        loadData();
    }

    function resetToToday() {
        selectedEthDate = getEthiopicDate();
        setPickerValues(selectedEthDate);
        loadData();
    }

    function switchPage(page) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        if (page === 'today') {
            document.getElementById('todayPage').classList.add('active');
            document.getElementById('btnToday').classList.add('active');
        } else {
            document.getElementById('historyPage').classList.add('active');
            document.getElementById('btnHistory').classList.add('active');
            loadHistory();
        }
    }

    function addStudent() {
        let nameInput = document.getElementById('studentName');
        let name = nameInput.value.trim();
        if (name === "") return alert("እባክዎን የተማሪ ስም ያስገቡ!");

        let studentId = "std_" + Date.now();
        database.ref('students/' + studentId).set({ id: studentId, name: name });
        nameInput.value = "";
    }

    // የተማሪን ስም እና የተያያዙ መረጃዎችን ሙሉ በሙሉ የማጥፋት አስተማማኝ ተግባር
    function deleteStudent(key, studentName) {
        if(confirm(`በእርግጥ ተማሪ "${studentName}"ን ማጥፋት ይፈልጋሉ?`)) {
            // 1. ከ 'students' node ስር በKey መሰረት ማጥፋት
            database.ref('students/' + key).remove().then(() => {
                // 2. ከሁሉም 'attendanceRecords' ውስጥ ከተማሪው ID/Key ጋር የተያያዙ መረጃዎችን ማጽዳት
                database.ref('attendanceRecords').once('value', snapshot => {
                    let records = snapshot.val() || {};
                    Object.keys(records).forEach(dateKey => {
                        database.ref(`attendanceRecords/${dateKey}/data/${key}`).remove();
                    });
                });
                alert(`ተማሪ "${studentName}" በተሳካ ሁኔታ ተሰርዟል!`);
            }).catch(error => {
                alert("ማጥፋት አልተቻለም፡ " + error.message);
            });
        }
    }

    function toggleAttendance(studentKey, isChecked, isLocked) {
        if (isLocked) {
            alert("ይህ መዝገብ የ 24 ሰዓት ጊዜው ስለሞላ መለወጥ አይቻልም!");
            return;
        }

        let dateKey = selectedEthDate.key;
        let dateRef = database.ref('attendanceRecords/' + dateKey);

        dateRef.once('value', snapshot => {
            let record = snapshot.val();
            let createdTimestamp = (record && record.createdTimestamp) ? record.createdTimestamp : Date.now();

            database.ref('attendanceRecords/' + dateKey + '/createdTimestamp').set(createdTimestamp);
            database.ref('attendanceRecords/' + dateKey + '/ethiopianDateText').set(selectedEthDate.formatted);
            database.ref('attendanceRecords/' + dateKey + '/data/' + studentKey).set(isChecked);
        });
    }

    function loadData() {
        database.ref().on('value', snapshot => {
            let allData = snapshot.val() || {};
            let studentsObj = allData.students || {};
            let studentKeys = Object.keys(studentsObj);
            
            let recordsObj = allData.attendanceRecords || {};
            let currentRecord = recordsObj[selectedEthDate.key] || {};
            let attendanceData = currentRecord.data || {};

            let createdTimestamp = currentRecord.createdTimestamp || Date.now();
            let currentTime = Date.now();
            let elapsedTime = currentTime - createdTimestamp;
            let isLocked = currentRecord.createdTimestamp && (elapsedTime >= TWENTY_FOUR_HOURS_MS);

            updateTimerUI(createdTimestamp, isLocked, currentRecord.createdTimestamp);

            let tbody = document.getElementById('studentList');
            tbody.innerHTML = "";

            if (studentKeys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ምንም የተመዘገበ ተማሪ የለም!</td></tr>';
                return;
            }

            studentKeys.forEach((key, index) => {
                let student = studentsObj[key];
                let isPresent = attendanceData[key] === true;
                let studentName = student.name || student;
                
                let row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${studentName}</td>
                        <td style="text-align: center;">
                            <input type="checkbox" style="width:20px; height:20px; cursor:pointer;" 
                                ${isPresent ? 'checked' : ''} 
                                ${isLocked ? 'disabled' : ''}
                                onchange="toggleAttendance('${key}', this.checked, ${isLocked})">
                        </td>
                        <td>
                            <button class="btn-delete" onclick="deleteStudent('${key}', '${studentName.replace(/'/g, "\\'")}')">አጥፋ</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    }

    function updateTimerUI(createdTimestamp, isLocked, hasCreatedTime) {
        let timerContainer = document.getElementById('timerContainer');
        let addStudentSection = document.getElementById('addStudentSection');

        if (!hasCreatedTime) {
            timerContainer.className = "timer-box";
            timerContainer.innerText = "ለዚህ ቀን ገና አቴንዳንስ አልተያዘም (አቴንዳንስ ሲይዙ የ24 ሰዓት ቆጣሪው ይጀምራል)";
            addStudentSection.style.display = "flex";
            return;
        }

        if (isLocked) {
            timerContainer.className = "locked-badge";
            timerContainer.innerText = "🔒 የዚህ ቀን መዝገብ የ 24 ሰዓት ጊዜው ስለሞላ ተዘጋቷል (Locked)";
            addStudentSection.style.display = "none";
        } else {
            timerContainer.className = "timer-box";
            addStudentSection.style.display = "flex";

            let remainingMs = TWENTY_FOUR_HOURS_MS - (Date.now() - createdTimestamp);
            if (remainingMs < 0) remainingMs = 0;

            let hours = Math.floor(remainingMs / (1000 * 60 * 60));
            let minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

            timerContainer.innerHTML = `ቀሪ ሰዓት (24 ሰዓት ከመዘጋቱ በፊት)፡ <span>${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}</span>`;
        }
    }

    function deleteHistoryRecord(dateKey) {
        if (confirm("በእርግጥ የዚህን ቀን የታሪክ መዝገብ በሙሉ ማጥፋት ይፈልጋሉ?")) {
            database.ref('attendanceRecords/' + dateKey).remove().then(() => {
                loadHistory();
            });
        }
    }

    function loadHistory() {
        database.ref('attendanceRecords').once('value', snapshot => {
            let records = snapshot.val() || {};
            let container = document.getElementById('historyContainer');
            container.innerHTML = "";

            database.ref('students').once('value', studSnapshot => {
                let studentsObj = studSnapshot.val() || {};
                let studentKeys = Object.keys(studentsObj);
                let dates = Object.keys(records).reverse();

                if (dates.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>ምንም የተቀመጠ ታሪክ የለም።</p>";
                    return;
                }

                dates.forEach(dateKey => {
                    let record = records[dateKey];
                    let card = document.createElement('div');
                    card.className = 'history-card';

                    let ethText = record.ethiopianDateText || dateKey;

                    let html = `
                        <div class="history-header">
                            <h4 style="color:#007bff; margin:0;">የቀን፡ ${ethText}</h4>
                            <div>
                                <button class="btn-excel" onclick="exportSingleHistoryToExcel('${dateKey}', '${ethText}')">Excel</button>
                                <button class="btn-delete" onclick="deleteHistoryRecord('${dateKey}')">አጥፋ</button>
                            </div>
                        </div>
                        <table>
                            <thead><tr><th>ተማሪ</th><th>ሁኔታ</th></tr></thead>
                            <tbody>`;
                    
                    studentKeys.forEach(key => {
                        let student = studentsObj[key];
                        let studentName = student.name || student;
                        let status = (record.data && record.data[key]) 
                            ? "<span style='color:green; font-weight:bold;'>ተገኝቷል</span>" 
                            : "<span style='color:red;'>አልተገኘም</span>";
                        html += `<tr><td>${studentName}</td><td>${status}</td></tr>`;
                    });
                    
                    html += `</tbody></table>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });
            });
        });
    }

    function downloadCSV(csvContent, fileName) {
        let blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        let url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportTodayToExcel() {
        database.ref().once('value', snapshot => {
            let allData = snapshot.val() || {};
            let studentsObj = allData.students || {};
            let studentKeys = Object.keys(studentsObj);
            let record = (allData.attendanceRecords && allData.attendanceRecords[selectedEthDate.key]) ? allData.attendanceRecords[selectedEthDate.key].data || {} : {};

            let csv = `ቀን: ${selectedEthDate.formatted}\n`;
            csv += `ተ.ቁ,የተማሪ ስም,ሁኔታ\n`;

            studentKeys.forEach((key, index) => {
                let student = studentsObj[key];
                let studentName = student.name || student;
                let status = record[key] ? "ተገኝቷል" : "አልተገኘም";
                csv += `${index + 1},"${studentName}",${status}\n`;
            });

            downloadCSV(csv, `Attendance_${selectedEthDate.key}.csv`);
        });
    }

    function exportSingleHistoryToExcel(dateKey, ethText) {
        database.ref().once('value', snapshot => {
            let allData = snapshot.val() || {};
            let studentsObj = allData.students || {};
            let studentKeys = Object.keys(studentsObj);
            let record = (allData.attendanceRecords && allData.attendanceRecords[dateKey]) ? allData.attendanceRecords[dateKey].data || {} : {};

            let csv = `ቀን: ${ethText}\n`;
            csv += `ተ.ቁ,የተማሪ ስም,ሁኔታ\n`;

            studentKeys.forEach((key, index) => {
                let student = studentsObj[key];
                let studentName = student.name || student;
                let status = record[key] ? "ተገኝቷል" : "አልተገኘም";
                csv += `${index + 1},"${studentName}",${status}\n`;
            });

            downloadCSV(csv, `Attendance_${dateKey}.csv`);
        });
    }

    function exportAllHistoryToExcel() {
        database.ref().once('value', snapshot => {
            let allData = snapshot.val() || {};
            let studentsObj = allData.students || {};
            let studentKeys = Object.keys(studentsObj);
            let records = allData.attendanceRecords || {};
            let dates = Object.keys(records);

            if (dates.length === 0) return alert("ምንም የተቀመጠ ታሪክ የለም!");

            let csv = `የተማሪ ስም`;
            dates.forEach(dateKey => {
                let ethText = records[dateKey].ethiopianDateText || dateKey;
                csv += `,"${ethText}"`;
            });
            csv += `\n`;

            studentKeys.forEach(key => {
                let student = studentsObj[key];
                let studentName = student.name || student;
                csv += `"${studentName}"`;
                dates.forEach(dateKey => {
                    let record = records[dateKey].data || {};
                    let status = record[key] ? "ተገኝቷል" : "አልተገኘም";
                    csv += `,${status}`;
                });
                csv += `\n`;
            });

            downloadCSV(csv, `Full_Attendance_History.csv`);
        });
    }

    setInterval(() => {
        loadData();
    }, 1000);

    window.onload = function() {
        populateDatePickers();
        loadData();
    };
</script>

</body>
