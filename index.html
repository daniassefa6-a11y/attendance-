<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sundros2019 - የተማሪዎች አቴንዳንስ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .school-header { text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .school-name { color: #007bff; margin: 0; font-size: 30px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        .nav-btn.active { background: #007bff; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-delete { background-color: #dc3545; padding: 5px 10px; border: none; color: white; border-radius: 3px; cursor: pointer; }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .timer-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; border: 1px solid #ffeeba; margin-bottom: 15px; font-weight: bold; text-align: center; }
        .locked-badge { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .history-card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="school-header">
        <h1 class="school-name">Sundros2019</h1>
        <p style="color:#555; margin:5px 0 0 0;">የተማሪዎች አቴንዳንስ መያዣ</p>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn active" id="btnToday" onclick="switchPage('today')">የዕለቱ መዝገብ</button>
        <button class="nav-btn" id="btnHistory" onclick="switchPage('history')">የቀደሙ ታሪኮች</button>
    </div>

    <!-- 1. የዕለቱ ገጽ -->
    <div id="todayPage" class="page-view active">
        <div style="margin-bottom: 15px; text-align: center;">
            <h3 style="margin:0; color:#333;">የዛሬ ቀን (በኢትዮጵያ ዘመን አቆጣጠር)፡</h3>
            <h2 id="ethiopianDateText" style="color:#007bff; margin:5px 0;">--/--/----</h2>
        </div>

        <div id="timerContainer" class="timer-box">
            ቀሪ ሰዓት (24 ሰዓት ከመዘጋቱ በፊት)፡ <span id="countdownTimer">--:--:--</span>
        </div>

        <div class="form-group" id="addStudentSection">
            <input type="text" id="studentName" placeholder="አዲስ ተማሪ ጨምር...">
            <button onclick="addStudent()">ተማሪ ጨምር</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ተ.ቁ</th>
                    <th>የተማሪ ስም</th>
                    <th>ሁኔታ</th>
                    <th>ድርጊት</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>

    <!-- 2. የታሪክ ገጽ -->
    <div id="historyPage" class="page-view">
        <h3>የተመዘገቡ የቀደሙ ታሪኮች</h3>
        <div id="historyContainer"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBngn2BpKdrFSeXq5lqMJT3PsyuFW0qiTA",
        authDomain: "project-7b8c40b5-a416-4965-98b.firebaseapp.com",
        databaseURL: "https://project-7b8c40b5-a416-4965-98b-default-rtdb.firebaseio.com",
        projectId: "project-7b8c40b5-a416-4965-98b",
        storageBucket: "project-7b8c40b5-a416-4965-98b.firebasestorage.app",
        messagingSenderId: "861183020980",
        appId: "1:861183020980:web:d2e9308421779611c96ce1",
        measurementId: "G-EPZCFKVZ27"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

    // የኢትዮጵያ ቀንን ማስያዣ አሰራር (Gregorian to Ethiopian Convertor)
    function getEthiopicDate(date = new Date()) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();

        let ethYear = year - 8;
        if (month < 9 || (month === 9 && day < 11)) {
            ethYear -= 1;
        }

        const isLeap = (ethYear + 1) % 4 === 0;
        const newYearDay = isLeap ? 12 : 11;

        const monthsEth = ["መስከረም", "ጥቅምት", "ኅዳር", "ታኅሣሥ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];
        
        let startOfEthYear = new Date(year, 8, newYearDay);
        if (date < startOfEthYear) {
            startOfEthYear = new Date(year - 1, 8, isLeap ? 12 : 11);
        }

        const diffDays = Math.floor((date - startOfEthYear) / (1000 * 60 * 60 * 24));
        let ethMonthIndex = Math.floor(diffDays / 30);
        let ethDay = (diffDays % 30) + 1;

        if (ethMonthIndex >= 12) {
            ethMonthIndex = 12;
            ethDay = diffDays - 360 + 1;
        }

        return {
            formatted: `${monthsEth[ethMonthIndex]} ${ethDay} ቀን ${ethYear} ዓ.ም`,
            key: `${ethYear}-${ethMonthIndex + 1}-${ethDay}`
        };
    }

    const todayEth = getEthiopicDate();
    document.getElementById('ethiopianDateText').innerText = todayEth.formatted;

    function switchPage(page) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        if (page === 'today') {
            document.getElementById('todayPage').classList.add('active');
            document.getElementById('btnToday').classList.add('active');
        } else {
            document.getElementById('historyPage').classList.add('active');
            document.getElementById('btnHistory').classList.add('active');
            loadHistory();
        }
    }

    function addStudent() {
        let nameInput = document.getElementById('studentName');
        let name = nameInput.value.trim();
        if (name === "") return alert("እባክዎን የተማሪ ስም ያስገቡ!");

        let studentId = Date.now();
        database.ref('students/' + studentId).set({ id: studentId, name: name });
        nameInput.value = "";
    }

    function deleteStudent(id) {
        if(confirm("በእርግጥ ይህንን ተማሪ ማጥፋት ይፈልጋሉ?")) {
            database.ref('students/' + id).remove();
        }
    }

    function toggleAttendance(studentId, isChecked, isLocked) {
        if (isLocked) {
            alert("ይህ መዝገብ የ 24 ሰዓት ጊዜው ስለሞላ መለወጥ አይቻልም!");
            return;
        }

        let dateKey = todayEth.key;
        let dateRef = database.ref('attendanceRecords/' + dateKey);

        dateRef.once('value', snapshot => {
            let record = snapshot.val();
            let createdTimestamp = (record && record.createdTimestamp) ? record.createdTimestamp : Date.now();

            database.ref('attendanceRecords/' + dateKey + '/createdTimestamp').set(createdTimestamp);
            database.ref('attendanceRecords/' + dateKey + '/ethiopianDateText').set(todayEth.formatted);
            database.ref('attendanceRecords/' + dateKey + '/data/' + studentId).set(isChecked);
        });
    }

    function loadData() {
        database.ref().on('value', snapshot => {
            let allData = snapshot.val() || {};
            let students = Object.values(allData.students || {});
            let recordsObj = allData.attendanceRecords || {};
            let currentRecord = recordsObj[todayEth.key] || {};
            let attendanceData = currentRecord.data || {};

            let createdTimestamp = currentRecord.createdTimestamp || Date.now();
            let currentTime = Date.now();
            let elapsedTime = currentTime - createdTimestamp;
            let isLocked = currentRecord.createdTimestamp && (elapsedTime >= TWENTY_FOUR_HOURS_MS);

            updateTimerUI(createdTimestamp, isLocked);

            let tbody = document.getElementById('studentList');
            tbody.innerHTML = "";

            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ምንም የተመዘገበ ተማሪ የለም!</td></tr>';
                return;
            }

            students.forEach((student, index) => {
                let isPresent = attendanceData[student.id] === true;
                let row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${student.name}</td>
                        <td style="text-align: center;">
                            <input type="checkbox" style="width:20px; height:20px;" 
                                ${isPresent ? 'checked' : ''} 
                                ${isLocked ? 'disabled' : ''}
                                onchange="toggleAttendance(${student.id}, this.checked, ${isLocked})">
                        </td>
                        <td>
                            <button class="btn-delete" ${isLocked ? 'disabled style="opacity:0.5;"' : ''} onclick="deleteStudent(${student.id})">አጥፋ</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    }

    function updateTimerUI(createdTimestamp, isLocked) {
        let timerContainer = document.getElementById('timerContainer');
        let addStudentSection = document.getElementById('addStudentSection');

        if (isLocked) {
            timerContainer.className = "locked-badge";
            timerContainer.innerText = "🔒 የዛሬው መዝገብ የ 24 ሰዓት ጊዜው ስለሞላ ተዘጋቷል (Locked)";
            addStudentSection.style.display = "none";
        } else {
            timerContainer.className = "timer-box";
            addStudentSection.style.display = "flex";

            let remainingMs = TWENTY_FOUR_HOURS_MS - (Date.now() - createdTimestamp);
            if (remainingMs < 0) remainingMs = 0;

            let hours = Math.floor(remainingMs / (1000 * 60 * 60));
            let minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

            document.getElementById('countdownTimer').innerText = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    }

    function loadHistory() {
        database.ref('attendanceRecords').once('value', snapshot => {
            let records = snapshot.val() || {};
            let container = document.getElementById('historyContainer');
            container.innerHTML = "";

            database.ref('students').once('value', studSnapshot => {
                let students = Object.values(studSnapshot.val() || {});
                let dates = Object.keys(records).reverse();

                if (dates.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>ምንም የተቀመጠ ታሪክ የለም።</p>";
                    return;
                }

                dates.forEach(dateKey => {
                    let record = records[dateKey];
                    let card = document.createElement('div');
                    card.className = 'history-card';

                    let ethText = record.ethiopianDateText || dateKey;

                    let html = `<h4 style="color:#007bff; margin-top:0;">የቀን፡ ${ethText}</h4><table><thead><tr><th>ተማሪ</th><th>ሁኔታ</th></tr></thead><tbody>`;
                    students.forEach(student => {
                        let status = (record.data && record.data[student.id]) 
                            ? "<span style='color:green; font-weight:bold;'>ተገኝቷል</span>" 
                            : "<span style='color:red;'>አልተገኘም</span>";
                        html += `<tr><td>${student.name}</td><td>${status}</td></tr>`;
                    });
                    html += `</tbody></table>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });
            });
        });
    }

    setInterval(() => {
        loadData();
    }, 1000);

    window.onload = loadData;
</script>

</body>
</html>
